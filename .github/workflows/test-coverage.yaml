# Test coverage and browser E2E workflow for CodingManageR
# Runs two parallel jobs on Ubuntu Linux:
#   1) test-coverage: instruments unit, SQLite/pool integration, and shiny::testServer()
#      tests under covr (without Chrome overhead) and uploads Cobertura XML to Codecov.
#   2) shinytest2-e2e: provisions headless Chrome and runs the full browser E2E suite
#      outside covr to prevent runner OOM kills (Exit Code 137).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      CODINGMANAGER_SKIP_E2E: "true"
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh apt package lists on Linux
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update && break || sleep 5
          done

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Query and install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::withr
          needs: coverage
          cache-version: 2

      - name: Compute test coverage with covr (unit, integration, and module server tests)
        run: |
          t_start <- proc.time()[["elapsed"]]
          log_phase <- function(msg, phase_start = NULL) {
            now_utc <- format(Sys.time(), "%Y-%m-%d %H:%M:%S UTC", tz = "UTC")
            total_s <- proc.time()[["elapsed"]] - t_start
            if (is.null(phase_start)) {
              cat(sprintf("[%s] [Total %6.1fs] %s\n", now_utc, total_s, msg))
            } else {
              phase_s <- proc.time()[["elapsed"]] - phase_start
              cat(sprintf("[%s] [Total %6.1fs | Phase %6.1fs] %s\n", now_utc, total_s, phase_s, msg))
            }
            flush.console()
          }

          options(covr.record_tests = FALSE)
          log_phase(sprintf(
            "Starting covr::package_coverage() (R %s, CODINGMANAGER_SKIP_E2E=%s, covr.record_tests=%s)",
            paste(R.version$major, R.version$minor, sep = "."),
            Sys.getenv("CODINGMANAGER_SKIP_E2E", unset = "<unset>"),
            as.character(getOption("covr.record_tests"))
          ))

          t_cov <- proc.time()[["elapsed"]]
          cov <- covr::package_coverage(
            type = "tests",
            quiet = FALSE,
            clean = TRUE
          )
          log_phase("Completed covr::package_coverage() instrumentation and test execution", t_cov)

          t_tally <- proc.time()[["elapsed"]]
          total_pct <- covr::percent_coverage(cov)
          cat(sprintf("\n=== CodingManageR Total Test Coverage: %.2f%% ===\n\n", total_pct))

          df_cov <- covr::tally_coverage(cov)
          if (nrow(df_cov) > 0) {
            for (f in sort(unique(df_cov$filename))) {
              sub <- df_cov[df_cov$filename == f, , drop = FALSE]
              pct <- 100 * mean(sub$value > 0)
              cat(sprintf("  %-38s : %6.2f%% (%d / %d lines)\n", f, pct, sum(sub$value > 0), nrow(sub)))
            }
          }
          cat("\n")
          log_phase("Completed covr::tally_coverage() summary", t_tally)

          t_xml <- proc.time()[["elapsed"]]
          covr::to_cobertura(cov, filename = "cobertura.xml")
          xml_size <- if (file.exists("cobertura.xml")) file.info("cobertura.xml")$size else NA_real_
          log_phase(sprintf("Exported cobertura.xml (%.1f KB)", xml_size / 1024), t_xml)
        shell: Rscript {0}

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  shinytest2-e2e:
    name: shinytest2-e2e (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      CODINGMANAGER_SKIP_E2E: "false"
      CHROMOTE_HEADLESS: new
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh apt package lists on Linux
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update && break || sleep 5
          done

      - name: Setup Headless Chrome for shinytest2 E2E tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Query and install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinytest2
            any::chromote
            any::testthat
            any::withr
          needs: check
          cache-version: 2

      - name: Install package for standalone shinytest2 E2E run
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run shinytest2 E2E tests (headless Chrome)
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          options(chromote.headless = "new")
          chromote::set_chrome_args(c("--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"))
          on.exit(try(chromote::default_chromote_object()$close(), silent = TRUE), add = TRUE)
          library(CodingManageR)
          testthat::test_dir("tests/testthat", filter = "shinytest2-e2e", stop_on_failure = TRUE)
        shell: Rscript {0}
