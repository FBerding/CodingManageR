# Test coverage and browser E2E workflow for CodingManageR
# Runs two parallel jobs on Ubuntu Linux:
#   1) test-coverage: instruments unit, SQLite/pool integration, and shiny::testServer()
#      tests under covr (without Chrome overhead) and uploads Cobertura XML to Codecov.
#   2) shinytest2-e2e: provisions headless Chrome and runs the full browser E2E suite
#      outside covr to prevent runner OOM kills (Exit Code 137).
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test-coverage:
    name: test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      CODINGMANAGER_SKIP_E2E: "true"
      TESTTHAT_PARALLEL: "false"
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DEBIAN_FRONTEND: noninteractive
      COVR_STAGE_DIR: /tmp/covr-ci

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh apt package lists on Linux
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update && break || sleep 5
          done

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Query and install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::covr
            any::xml2
            any::withr
          needs: check
          cache-version: 2

      - name: Compute test coverage per test file with covr and merge
        shell: bash
        run: |
          set -euo pipefail

          STAGE_DIR="${COVR_STAGE_DIR:-/tmp/covr-ci}"
          SHARD_DIR="$STAGE_DIR/shards"
          SUBLOG_DIR="$STAGE_DIR/logs"
          LOG_FILE="$STAGE_DIR/covr-diagnostics.log"
          SUMMARY_TSV="$STAGE_DIR/summary_rows.tsv"
          rm -rf "$STAGE_DIR"
          mkdir -p "$SHARD_DIR" "$SUBLOG_DIR"
          : > "$SUMMARY_TSV"

          log_msg() {
            local ts
            ts="$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            printf '[%s] %s\n' "$ts" "$1" | tee -a "$LOG_FILE"
          }

          log_msg "=== Starting per-file isolated covr coverage run ==="
          log_msg "CPU cores: $(nproc) | TESTTHAT_PARALLEL=${TESTTHAT_PARALLEL} | OMP_NUM_THREADS=${OMP_NUM_THREADS}"
          R --version | head -n 1 | tee -a "$LOG_FILE"
          free -m | tee -a "$LOG_FILE"

          cat > "$STAGE_DIR/run_one_covr.R" <<'RSCRIPT_ONE'
          args <- commandArgs(trailingOnly = TRUE)
          stem <- args[[1]]
          stage_dir <- args[[2]]
          shard_dir <- file.path(stage_dir, "shards")

          read_peak_rss_mb <- function() {
            if (!file.exists("/proc/self/status")) return(NA_real_)
            st <- tryCatch(readLines("/proc/self/status", warn = FALSE), error = function(e) character(0))
            hit <- grep("^VmHWM:", st, value = TRUE)
            if (length(hit) == 0L) return(NA_real_)
            kb <- suppressWarnings(as.numeric(gsub("[^0-9]", "", hit[[1]])))
            if (is.na(kb)) NA_real_ else kb / 1024
          }

          options(covr.record_tests = FALSE)
          t0 <- proc.time()[["elapsed"]]
          test_dir_abs <- normalizePath("tests/testthat", winslash = "/", mustWork = TRUE)
          escaped_stem <- gsub("([.|()\\^{}+$*?\\[\\]])", "\\\\\\1", stem)
          test_code <- sprintf(
            'library(CodingManageR); testthat::test_dir(%s, filter = %s, stop_on_failure = TRUE)',
            deparse(test_dir_abs),
            deparse(paste0("^", escaped_stem, "$"))
          )

          cat(sprintf("[%s] [%s] Running covr::package_coverage(type = 'none')...\n",
                      format(Sys.time(), "%Y-%m-%d %H:%M:%S UTC", tz = "UTC"), stem))
          flush.console()

          cov <- covr::package_coverage(
            type = "none",
            code = test_code,
            quiet = FALSE,
            clean = TRUE
          )

          df_tally <- covr::tally_coverage(cov, by = "line")
          saveRDS(df_tally, file = file.path(shard_dir, paste0("tally-", stem, ".rds")))

          tpl_xml <- file.path(stage_dir, "template-cobertura.xml")
          if (!file.exists(tpl_xml)) {
            covr::to_cobertura(cov, filename = tpl_xml)
          }

          elapsed_s <- proc.time()[["elapsed"]] - t0
          peak_mb <- read_peak_rss_mb()
          file_lines <- if (nrow(df_tally) > 0L) {
            stats::aggregate(value ~ filename + line, data = df_tally, FUN = sum)
          } else {
            data.frame(filename = character(0), line = integer(0), value = numeric(0))
          }
          n_valid <- nrow(file_lines)
          n_hit <- sum(file_lines$value > 0)
          pct <- if (n_valid > 0L) 100 * n_hit / n_valid else 0

          metrics_line <- sprintf(
            "%.1fs\t%.1f MB\t%.2f%% (%d/%d)",
            elapsed_s,
            if (is.na(peak_mb)) 0 else peak_mb,
            pct,
            n_hit,
            n_valid
          )
          writeLines(metrics_line, con = file.path(stage_dir, paste0("metrics-", stem, ".tsv")))

          cat(sprintf(
            "[%s] [%s] DONE | elapsed=%6.1fs | peak_rss=%6.1f MB | shard_coverage=%6.2f%% (%d / %d lines)\n",
            format(Sys.time(), "%Y-%m-%d %H:%M:%S UTC", tz = "UTC"),
            stem, elapsed_s, peak_mb, pct, n_hit, n_valid
          ))
          flush.console()
          RSCRIPT_ONE

          cat > "$STAGE_DIR/merge_covr.R" <<'RSCRIPT_MERGE'
          args <- commandArgs(trailingOnly = TRUE)
          stage_dir <- args[[1]]
          shard_dir <- file.path(stage_dir, "shards")
          tpl_xml <- file.path(stage_dir, "template-cobertura.xml")

          t0 <- proc.time()[["elapsed"]]
          rds_files <- sort(list.files(shard_dir, pattern = "^tally-.*\\.rds$", full.names = TRUE))
          if (length(rds_files) == 0L) {
            stop("No coverage tally shard files found in ", shard_dir)
          }
          if (!file.exists(tpl_xml)) {
            stop("Template Cobertura XML not found at ", tpl_xml)
          }

          all_df <- do.call(rbind, lapply(rds_files, readRDS))
          file_agg <- stats::aggregate(value ~ filename + line, data = all_df, FUN = sum)
          meth_rows <- all_df[!is.na(all_df$functions), , drop = FALSE]
          meth_agg <- if (nrow(meth_rows) > 0L) {
            stats::aggregate(value ~ filename + functions + line, data = meth_rows, FUN = sum)
          } else {
            data.frame(filename = character(0), functions = character(0), line = integer(0), value = numeric(0))
          }

          lines_valid <- nrow(file_agg)
          lines_covered <- sum(file_agg$value > 0)
          overall_rate <- if (lines_valid > 0L) lines_covered / lines_valid else 0

          cat(sprintf("\n=== CodingManageR Combined Test Coverage (%d test files): %.2f%% (%d / %d lines) ===\n\n",
                      length(rds_files), 100 * overall_rate, lines_covered, lines_valid))
          md_lines <- c(
            sprintf("### Combined Coverage: %.2f%% (%d / %d lines across %d test files)",
                    100 * overall_rate, lines_covered, lines_valid, length(rds_files)),
            "",
            "| Source File | Coverage | Covered / Valid Lines |",
            "| :--- | ---: | ---: |"
          )
          for (f in sort(unique(file_agg$filename))) {
            sub <- file_agg[file_agg$filename == f, , drop = FALSE]
            pct <- 100 * mean(sub$value > 0)
            cat(sprintf("  %-38s : %6.2f%% (%d / %d lines)\n", f, pct, sum(sub$value > 0), nrow(sub)))
            md_lines <- c(md_lines, sprintf("| `%s` | %.2f%% | %d / %d |", f, pct, sum(sub$value > 0), nrow(sub)))
          }
          cat("\n")

          file_hits <- stats::setNames(
            as.integer(file_agg$value),
            paste(file_agg$filename, file_agg$line, sep = "\r")
          )
          meth_hits <- stats::setNames(
            as.integer(meth_agg$value),
            paste(meth_agg$filename, meth_agg$functions, meth_agg$line, sep = "\r")
          )

          doc <- xml2::read_xml(tpl_xml)
          class_nodes <- xml2::xml_find_all(doc, ".//class")
          for (cls in class_nodes) {
            fname <- xml2::xml_attr(cls, "filename")

            ln_nodes <- xml2::xml_find_all(cls, "./lines/line")
            if (length(ln_nodes) > 0L) {
              nums <- xml2::xml_attr(ln_nodes, "number")
              h <- unname(file_hits[paste(fname, nums, sep = "\r")])
              h[is.na(h)] <- 0L
              xml2::xml_set_attr(ln_nodes, "hits", as.character(h))
              xml2::xml_set_attr(cls, "line-rate", as.character(sum(h > 0L) / length(h)))
            } else {
              xml2::xml_set_attr(cls, "line-rate", "0")
            }

            method_nodes <- xml2::xml_find_all(cls, "./methods/method")
            for (mnode in method_nodes) {
              mname <- xml2::xml_attr(mnode, "name")
              mln_nodes <- xml2::xml_find_all(mnode, "./lines/line")
              if (length(mln_nodes) > 0L) {
                mnums <- xml2::xml_attr(mln_nodes, "number")
                mh <- unname(meth_hits[paste(fname, mname, mnums, sep = "\r")])
                missing_idx <- is.na(mh)
                if (any(missing_idx)) {
                  mh[missing_idx] <- unname(file_hits[paste(fname, mnums[missing_idx], sep = "\r")])
                }
                mh[is.na(mh)] <- 0L
                xml2::xml_set_attr(mln_nodes, "hits", as.character(mh))
                xml2::xml_set_attr(mnode, "line-rate", as.character(sum(mh > 0L) / length(mh)))
              } else {
                xml2::xml_set_attr(mnode, "line-rate", "0")
              }
            }
          }

          pkg_nodes <- xml2::xml_find_all(doc, ".//package")
          if (length(pkg_nodes) > 0L) {
            xml2::xml_set_attr(pkg_nodes, "line-rate", as.character(overall_rate))
          }

          root_node <- xml2::xml_root(doc)
          xml2::xml_set_attr(root_node, "line-rate", as.character(overall_rate))
          xml2::xml_set_attr(root_node, "lines-covered", as.character(lines_covered))
          xml2::xml_set_attr(root_node, "lines-valid", as.character(lines_valid))
          xml2::xml_set_attr(root_node, "timestamp", as.character(Sys.time()))

          xml2::write_xml(doc, file = "cobertura.xml")
          invisible(xml2::read_xml("cobertura.xml"))
          xml_kb <- file.info("cobertura.xml")$size / 1024
          md_lines <- c(
            md_lines,
            "",
            sprintf("_Merged `cobertura.xml` written and validated (%.1f KB) in %.1fs._", xml_kb, proc.time()[["elapsed"]] - t0)
          )
          writeLines(md_lines, con = file.path(stage_dir, "combined_summary.md"))

          cat(sprintf(
            "[%s] Merged cobertura.xml written and validated (%.1f KB) in %.1fs\n",
            format(Sys.time(), "%Y-%m-%d %H:%M:%S UTC", tz = "UTC"),
            xml_kb,
            proc.time()[["elapsed"]] - t0
          ))
          flush.console()
          RSCRIPT_MERGE

          mapfile -t TEST_FILES < <(find tests/testthat -maxdepth 1 -type f -name 'test-*.R' ! -name 'test-shinytest2-e2e.R' | sort)
          log_msg "Discovered ${#TEST_FILES[@]} non-E2E test files for isolated covr execution."

          for tf in "${TEST_FILES[@]}"; do
            base="$(basename "$tf")"
            stem="${base#test-}"
            stem="${stem%.R}"
            sublog="$SUBLOG_DIR/${stem}.log"
            metrics_file="$STAGE_DIR/metrics-${stem}.tsv"
            t_start="$(date +%s)"
            log_msg ">>> Launching isolated Rscript subprocess for: ${base} (filter=^${stem}$)"
            rc=0
            Rscript "$STAGE_DIR/run_one_covr.R" "$stem" "$STAGE_DIR" 2>&1 | tee "$sublog" | tee -a "$LOG_FILE" || rc=$?
            t_end="$(date +%s)"
            wall_s=$((t_end - t_start))
            if [ "$rc" -ne 0 ]; then
              log_msg "!!! FAILURE: ${base} exited with code ${rc} after ${wall_s}s"
              printf '%s\tFAIL (exit %s)\t%ss\t-\t-\n' "$base" "$rc" "$wall_s" >> "$SUMMARY_TSV"
              printf '%s\t%s\n' "$base" "$rc" > "$STAGE_DIR/failure_meta.tsv"
              start_ln="$(awk '/Failed tests|Failure|Error|Backtrace:|FAIL [0-9]+/ { print NR; exit }' "$sublog" || true)"
              if [ -n "$start_ln" ]; then
                tail -n +"$start_ln" "$sublog" | tail -n 80 > "$STAGE_DIR/failure_excerpt.txt" || true
              else
                tail -n 80 "$sublog" > "$STAGE_DIR/failure_excerpt.txt" || true
              fi
              printf '::error file=tests/testthat/%s,title=test-coverage failed in %s::Subprocess exited with code %s after %ss. See Job Summary for extracted testthat failure details.\n' "$base" "$base" "$rc" "$wall_s"
              free -m | tee -a "$LOG_FILE"
              exit "$rc"
            fi
            if [ -f "$metrics_file" ]; then
              IFS=$'\t' read -r m_elapsed m_rss m_cov < "$metrics_file"
              printf '%s\tPASS\t%s\t%s\t%s\n' "$base" "$m_elapsed" "$m_rss" "$m_cov" >> "$SUMMARY_TSV"
            else
              printf '%s\tPASS\t%ss\t-\t-\n' "$base" "$wall_s" >> "$SUMMARY_TSV"
            fi
            avail_mb="$(free -m | awk '/^Mem:/ {print $7}')"
            log_msg "<<< Subprocess for ${base} exited cleanly (available runner RAM: ${avail_mb} MB)"
          done

          log_msg ">>> Merging all per-file coverage shards into ./cobertura.xml"
          Rscript "$STAGE_DIR/merge_covr.R" "$STAGE_DIR" 2>&1 | tee -a "$LOG_FILE"
          log_msg "=== Per-file covr coverage run completed successfully ==="

      - name: Write coverage and failure summary to GitHub Job Summary
        if: always()
        shell: bash
        run: |
          STAGE_DIR="${COVR_STAGE_DIR:-/tmp/covr-ci}"
          SUMMARY_TSV="$STAGE_DIR/summary_rows.tsv"
          {
            echo "## CodingManageR Test Coverage Summary"
            echo ""
            if [ -f "$STAGE_DIR/failure_meta.tsv" ]; then
              IFS=$'\t' read -r fail_file fail_rc < "$STAGE_DIR/failure_meta.tsv"
              echo "> **Status:** Failed in \`tests/testthat/${fail_file}\` (exit code \`${fail_rc}\`)"
            elif [ -f "$STAGE_DIR/combined_summary.md" ]; then
              echo "> **Status:** Passed (all isolated test shards completed and merged)"
            else
              echo "> **Status:** Did not complete before coverage summary generation"
            fi
            echo ""
            if [ -s "$SUMMARY_TSV" ]; then
              echo "### Per-Test-File Execution"
              echo ""
              echo "| Test File | Status | Elapsed | Peak RSS | Shard Coverage |"
              echo "| :--- | :--- | ---: | ---: | ---: |"
              while IFS=$'\t' read -r tf st el rss cov; do
                printf '| `%s` | %s | %s | %s | %s |\n' "$tf" "$st" "$el" "$rss" "$cov"
              done < "$SUMMARY_TSV"
              echo ""
            fi
            if [ -f "$STAGE_DIR/failure_excerpt.txt" ]; then
              IFS=$'\t' read -r fail_file fail_rc < "$STAGE_DIR/failure_meta.tsv"
              echo "### Failure Details (\`tests/testthat/${fail_file}\`)"
              echo ""
              echo '```text'
              cat "$STAGE_DIR/failure_excerpt.txt"
              echo '```'
              echo ""
            fi
            if [ -f "$STAGE_DIR/combined_summary.md" ]; then
              cat "$STAGE_DIR/combined_summary.md"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage diagnostics log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: covr-diagnostics-log
          path: /tmp/covr-ci/covr-diagnostics.log
          retention-days: 14
          if-no-files-found: warn

      - name: Upload coverage report to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./cobertura.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

  shinytest2-e2e:
    name: shinytest2-e2e (headless Chrome)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      NOT_CRAN: true
      CODINGMANAGER_SKIP_E2E: "false"
      CHROMOTE_HEADLESS: new
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Refresh apt package lists on Linux
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update && break || sleep 5
          done

      - name: Setup Headless Chrome for shinytest2 E2E tests
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Query and install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinytest2
            any::chromote
            any::testthat
            any::withr
          needs: check
          cache-version: 2

      - name: Install package for standalone shinytest2 E2E run
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Run shinytest2 E2E tests (headless Chrome)
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          options(chromote.headless = "new")
          chromote::set_chrome_args(c("--no-sandbox", "--disable-gpu", "--disable-dev-shm-usage"))
          on.exit(try(chromote::default_chromote_object()$close(), silent = TRUE), add = TRUE)
          library(CodingManageR)
          testthat::test_dir("tests/testthat", filter = "shinytest2-e2e", stop_on_failure = TRUE)
        shell: Rscript {0}
