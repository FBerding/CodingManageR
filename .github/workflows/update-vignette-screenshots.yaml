# Automated vignette screenshot generation and pkgdown site update workflow
# Manually triggered via workflow_dispatch with selectable language scope (all / en / de):
#   1) Launches CodingManageR in headless Chrome via shinytest2/chromote
#   2) Captures 12 English PNGs (vignettes/figures/) and/or 12 German PNGs (vignettes/figures-de/)
#   3) Optimizes PNG file sizes with pngquant + optipng to stay well below CRAN's 5 MB limit
#   4) Verifies all four vignettes (2 EN + 2 DE) render cleanly with embedded screenshots
#   5) Rebuilds the pkgdown GitHub Pages site in docs/ and verifies EN + DE assets
#   6) Uploads all PNGs as a downloadable artifact and commits screenshots + docs/ atomically
on:
  workflow_dispatch:
    inputs:
      languages:
        description: "Languages to capture screenshots for (all = EN + DE, en = English only, de = German only)"
        required: true
        type: choice
        default: "all"
        options:
          - all
          - en
          - de
      commit_changes:
        description: "Commit and push generated screenshots (and pkgdown docs/) directly to this branch"
        required: true
        type: boolean
        default: true
      update_pkgdown:
        description: "Rebuild the pkgdown GitHub Pages site in docs/ after updating screenshots"
        required: true
        type: boolean
        default: true
      viewport_width:
        description: "Browser viewport width in pixels"
        required: false
        type: string
        default: "1280"
      viewport_height:
        description: "Browser viewport height in pixels"
        required: false
        type: string
        default: "860"

name: update-vignette-screenshots

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  generate-screenshots:
    name: Generate EN/DE screenshots and update pkgdown site
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      CHROMOTE_HEADLESS: new
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: true
      DEBIAN_FRONTEND: noninteractive

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Install PNG optimization utilities (pngquant, optipng)
        run: |
          for i in 1 2 3; do
            sudo DEBIAN_FRONTEND=noninteractive apt-get update && break || sleep 5
          done
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y pngquant optipng

      - name: Setup Headless Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2

      - name: Setup Pandoc
        uses: r-lib/actions/setup-pandoc@v2

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Query and install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::shinytest2
            any::chromote
            any::knitr
            any::rmarkdown
            any::pkgdown
            any::withr
          needs: check
          cache-version: 2

      - name: Install CodingManageR package
        run: R CMD INSTALL --no-multiarch --with-keep.source .

      - name: Generate 12 English-language app screenshots
        if: ${{ inputs.languages == 'all' || inputs.languages == 'en' }}
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          Rscript tools/generate_vignette_screenshots.R \
            --output-dir vignettes/figures \
            --width "${{ inputs.viewport_width }}" \
            --height "${{ inputs.viewport_height }}" \
            --lang en

      - name: Generate 12 German-language app screenshots
        if: ${{ inputs.languages == 'all' || inputs.languages == 'de' }}
        env:
          CHROMOTE_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          Rscript tools/generate_vignette_screenshots.R \
            --output-dir vignettes/figures-de \
            --width "${{ inputs.viewport_width }}" \
            --height "${{ inputs.viewport_height }}" \
            --lang de

      - name: Optimize PNG sizes for CRAN tarball budget
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob

          mkdir -p /tmp/screenshot-report
          : > /tmp/screenshot-report/sizes.tsv

          langs="${{ inputs.languages }}"
          dirs=()
          if [ "$langs" = "all" ] || [ "$langs" = "en" ]; then
            dirs+=("en:vignettes/figures")
          fi
          if [ "$langs" = "all" ] || [ "$langs" = "de" ]; then
            dirs+=("de:vignettes/figures-de")
          fi

          total_before=0
          total_after=0
          total_count=0

          for entry in "${dirs[@]}"; do
            lang_code="${entry%%:*}"
            dir_path="${entry#*:}"
            files=("${dir_path}"/*.png)
            if [ "${#files[@]}" -eq 0 ]; then
              echo "No PNG files found in ${dir_path}/" >&2
              exit 1
            fi

            for f in "${files[@]}"; do
              before_bytes="$(stat -c%s "$f")"
              total_before=$((total_before + before_bytes))

              # Lossy palette quantization (high visual fidelity) skipping if larger
              pngquant --quality=72-90 --speed 1 --strip --skip-if-larger --force --output "$f" "$f" || true
              # Lossless deflate optimization
              optipng -o2 -strip all -quiet "$f" || true

              after_bytes="$(stat -c%s "$f")"
              total_after=$((total_after + after_bytes))
              total_count=$((total_count + 1))
              printf '%s\t%s\t%d\t%d\n' "$lang_code" "$(basename "$f")" "$before_bytes" "$after_bytes" >> /tmp/screenshot-report/sizes.tsv
            done
          done

          # Compute combined footprint across both vignette figure directories
          combined_bytes=0
          combined_count=0
          for d in vignettes/figures vignettes/figures-de; do
            for f in "${d}"/*.png; do
              [ -f "$f" ] || continue
              b="$(stat -c%s "$f")"
              combined_bytes=$((combined_bytes + b))
              combined_count=$((combined_count + 1))
            done
          done

          printf 'TOTAL\t%d\t%d\t%d\t%d\t%d\n' \
            "$total_count" "$total_before" "$total_after" "$combined_count" "$combined_bytes" \
            > /tmp/screenshot-report/total.tsv

      - name: Verify all four vignettes render cleanly with embedded screenshots
        run: |
          mkdir -p /tmp/vignette-preview
          Rscript -e '
            vignettes <- c(
              "vignettes/CodingManageR.Rmd",
              "vignettes/introduction.Rmd",
              "vignettes/CodingManageR-de.Rmd",
              "vignettes/introduction-de.Rmd"
            )
            for (v in vignettes) {
              rmarkdown::render(v, output_dir = "/tmp/vignette-preview", quiet = TRUE)
              h <- sub("\\.Rmd$", ".html", basename(v))
              p <- file.path("/tmp/vignette-preview", h)
              if (!file.exists(p)) stop("Rendered vignette missing: ", p)
              cat(sprintf("Rendered %-26s : %6.1f KB\n", h, file.info(p)$size / 1024))
            }
          '

      - name: Rebuild pkgdown GitHub Pages site in docs/
        if: ${{ inputs.update_pkgdown }}
        run: |
          Rscript -e '
            pkgdown::build_site(devel = FALSE, install = FALSE, preview = FALSE)
          '

      - name: Verify pkgdown articles, logo, favicons, and EN/DE figure assets in docs/
        if: ${{ inputs.update_pkgdown }}
        shell: bash
        run: |
          set -euo pipefail
          test -f docs/index.html
          test -f docs/logo.png
          test -f docs/favicon.ico
          test -f docs/favicon-32x32.png
          test -f docs/articles/CodingManageR.html
          test -f docs/articles/introduction.html
          test -f docs/articles/CodingManageR-de.html
          test -f docs/articles/introduction-de.html

          for png in vignettes/figures/*.png; do
            base="$(basename "$png")"
            if [ ! -f "docs/articles/figures/${base}" ]; then
              echo "Missing EN figure asset in pkgdown output: docs/articles/figures/${base}" >&2
              exit 1
            fi
          done

          for png in vignettes/figures-de/*.png; do
            base="$(basename "$png")"
            if [ ! -f "docs/articles/figures-de/${base}" ]; then
              echo "Missing DE figure asset in pkgdown output: docs/articles/figures-de/${base}" >&2
              exit 1
            fi
          done

          grep -q "Figure 1:" docs/articles/CodingManageR.html
          grep -q "Figure 2:" docs/articles/CodingManageR.html
          grep -q "Figure 1:" docs/articles/introduction.html
          grep -q "Figure 12:" docs/articles/introduction.html
          grep -q "figures/01-login.png" docs/articles/CodingManageR.html
          grep -q "figures/12-admin-db-diagnosis.png" docs/articles/introduction.html

          grep -q "Abbildung 1:" docs/articles/CodingManageR-de.html
          grep -q "Abbildung 2:" docs/articles/CodingManageR-de.html
          grep -q "Abbildung 1:" docs/articles/introduction-de.html
          grep -q "Abbildung 12:" docs/articles/introduction-de.html
          grep -q "figures-de/01-login.png" docs/articles/CodingManageR-de.html
          grep -q "figures-de/12-admin-db-diagnosis.png" docs/articles/introduction-de.html
          echo "Verified pkgdown site in docs/ with all EN + DE articles and 24 figure assets."

      - name: Write screenshot and pkgdown summary to GitHub Job Summary
        if: always()
        shell: bash
        run: |
          {
            echo "## CodingManageR Vignette Screenshots & pkgdown Summary"
            echo ""
            echo "- Selected languages: \`${{ inputs.languages }}\`"
            echo "- Viewport: \`${{ inputs.viewport_width }}x${{ inputs.viewport_height }}\`"
            echo ""
            if [ -f /tmp/screenshot-report/sizes.tsv ]; then
              echo "| Language | File | Raw Size | Optimized Size | Savings |"
              echo "| :---: | :--- | ---: | ---: | ---: |"
              while IFS=$'\t' read -r lang_code fname b_raw b_opt; do
                kb_raw="$(awk -v b="$b_raw" 'BEGIN { printf "%.1f KB", b/1024 }')"
                kb_opt="$(awk -v b="$b_opt" 'BEGIN { printf "%.1f KB", b/1024 }')"
                pct="$(awk -v r="$b_raw" -v o="$b_opt" 'BEGIN { if (r > 0) printf "%.0f%%", (1 - o/r) * 100; else print "0%" }')"
                printf '| `%s` | `%s` | %s | %s | %s |\n' "$lang_code" "$fname" "$kb_raw" "$kb_opt" "$pct"
              done < /tmp/screenshot-report/sizes.tsv
              if [ -f /tmp/screenshot-report/total.tsv ]; then
                IFS=$'\t' read -r _ tot_n tot_raw tot_opt comb_n comb_bytes < /tmp/screenshot-report/total.tsv
                tot_raw_kb="$(awk -v b="$tot_raw" 'BEGIN { printf "%.1f KB", b/1024 }')"
                tot_opt_kb="$(awk -v b="$tot_opt" 'BEGIN { printf "%.1f KB", b/1024 }')"
                tot_pct="$(awk -v r="$tot_raw" -v o="$tot_opt" 'BEGIN { if (r > 0) printf "%.0f%%", (1 - o/r) * 100; else print "0%" }')"
                comb_mb="$(awk -v b="$comb_bytes" 'BEGIN { printf "%.2f MB", b/1048576 }')"
                printf '| **Run Total** | **%s PNGs** | **%s** | **%s** | **%s** |\n' "$tot_n" "$tot_raw_kb" "$tot_opt_kb" "$tot_pct"
                echo ""
                echo "- Combined footprint across \`vignettes/figures/\` + \`vignettes/figures-de/\` (${comb_n} PNGs): **${comb_mb}** (CRAN 5 MB budget)."
                if [ "$comb_bytes" -gt 3145728 ]; then
                  echo ""
                  echo "> **Warning:** Combined optimized PNG directories exceed 3.0 MB; review CRAN tarball size before release."
                fi
              fi
              echo ""
            fi
            if [ -d /tmp/vignette-preview ]; then
              echo "### Rendered Vignette Sizes (with Base64-embedded PNGs)"
              echo ""
              for h in /tmp/vignette-preview/*.html; do
                [ -f "$h" ] || continue
                h_kb="$(awk -v b="$(stat -c%s "$h")" 'BEGIN { printf "%.1f KB", b/1024 }')"
                printf -- '- `%s`: %s\n' "$(basename "$h")" "$h_kb"
              done
              echo ""
            fi
            if [ "${{ inputs.update_pkgdown }}" = "true" ] && [ -f docs/pkgdown.yml ]; then
              echo "### pkgdown GitHub Pages Build (\`docs/\`)"
              echo ""
              n_en="0"
              n_de="0"
              if [ -d docs/articles/figures ]; then
                n_en="$(find docs/articles/figures -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
              fi
              if [ -d docs/articles/figures-de ]; then
                n_de="$(find docs/articles/figures-de -maxdepth 1 -type f -name '*.png' | wc -l | tr -d ' ')"
              fi
              echo "- Rebuilt \`docs/\` successfully with **${n_en}** EN PNGs (\`docs/articles/figures/\`) and **${n_de}** DE PNGs (\`docs/articles/figures-de/\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload generated screenshots as artifact
        uses: actions/upload-artifact@v7
        with:
          name: vignette-screenshots-${{ inputs.languages }}
          path: |
            vignettes/figures/*.png
            vignettes/figures-de/*.png
          retention-days: 14
          if-no-files-found: error

      - name: Commit and push updated screenshots and pkgdown site to current branch
        if: ${{ inputs.commit_changes }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          langs="${{ inputs.languages }}"
          if [ "$langs" = "all" ] || [ "$langs" = "en" ]; then
            git add vignettes/figures/*.png
          fi
          if [ "$langs" = "all" ] || [ "$langs" = "de" ]; then
            git add vignettes/figures-de/*.png
          fi
          if [ "${{ inputs.update_pkgdown }}" = "true" ]; then
            git add -A docs
          fi

          if git diff --cached --quiet; then
            echo "No changes in vignette figures or docs/ — skipping commit."
            exit 0
          fi

          if [ "${{ inputs.update_pkgdown }}" = "true" ]; then
            git commit -m "docs(vignettes): update ${langs} app screenshots and pkgdown site"
          else
            git commit -m "docs(vignettes): update ${langs} app screenshots"
          fi
          git push origin "HEAD:${{ github.ref_name }}"
